[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-lint"
dynamic = ["version"]
description = "规则式提示词体检工具:离线、确定性、可测试,在调用模型之前先抓住低级问题"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yange0793-dot" }]
keywords = ["prompt", "lint", "cli", "llm", "prompt-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
promptlint = "promptlint.cli:main"

[project.urls]
Homepage = "https://github.com/yange0793-dot/prompt-lint"
Repository = "https://github.com/yange0793-dot/prompt-lint"
Issues = "https://github.com/yange0793-dot/prompt-lint/issues"

[tool.setuptools.packages.find]
where = ["src"]

# 版本号只写在 promptlint/__init__.py 一处,pyproject 与 --version 都从那里取
[tool.setuptools.dynamic]
version = { attr = "promptlint.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
